name: Build & Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            artifact: windows-installer
            extension: msi
            javafx_platform: win
          - os: macos-latest
            artifact: macos-installer
            extension: dmg
            javafx_platform: mac
          - os: ubuntu-latest
            artifact: linux-installer
            extension: deb
            javafx_platform: linux

    runs-on: ${{ matrix.os }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Build fat JAR
        run: mvn clean package -DskipTests

      - name: Download JavaFX jmods
        shell: bash
        run: |
          JAVAFX_VERSION=21.0.1
          if [ "${{ matrix.javafx_platform }}" = "win" ]; then
            curl -L -o javafx-jmods.zip "https://download2.gluonhq.com/openjfx/${JAVAFX_VERSION}/openjfx-${JAVAFX_VERSION}_windows-x64_bin-jmods.zip"
          elif [ "${{ matrix.javafx_platform }}" = "mac" ]; then
            curl -L -o javafx-jmods.zip "https://download2.gluonhq.com/openjfx/${JAVAFX_VERSION}/openjfx-${JAVAFX_VERSION}_osx-x64_bin-jmods.zip"
          else
            curl -L -o javafx-jmods.zip "https://download2.gluonhq.com/openjfx/${JAVAFX_VERSION}/openjfx-${JAVAFX_VERSION}_linux-x64_bin-jmods.zip"
          fi
          unzip javafx-jmods.zip
          echo "JAVAFX_JMODS=$(pwd)/javafx-jmods-${JAVAFX_VERSION}" >> $GITHUB_ENV

      - name: Prepare app directory
        shell: bash
        run: |
          mkdir -p app-input
          cp target/lost-game-database-*.jar app-input/lost-game-database.jar
          # Remove original-* jar if exists
          rm -f app-input/original-*

      - name: Create installer with jpackage
        shell: bash
        run: |
          APP_VERSION="${GITHUB_REF_NAME#v}"
          # Ensure version is valid (X.Y.Z format)
          if ! echo "$APP_VERSION" | grep -qE '^[0-9]+\.[0-9]+'; then
            APP_VERSION="1.0.0"
          fi
          
          jpackage \
            --input app-input \
            --main-jar lost-game-database.jar \
            --main-class com.lost.database.app.Launcher \
            --name "LOST" \
            --app-version "$APP_VERSION" \
            --vendor "Izumi255" \
            --description "LOST - Database Management System Game" \
            --type ${{ matrix.extension }} \
            --dest dist \
            --module-path "$JAVAFX_JMODS" \
            --add-modules java.base,java.sql,java.desktop,java.logging,java.naming,java.prefs,java.xml,java.datatransfer,java.scripting,jdk.unsupported,javafx.controls,javafx.fxml,javafx.media \
            --java-options "-Dfile.encoding=UTF-8"

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/*.${{ matrix.extension }}

  release:
    needs: build
    runs-on: ubuntu-latest
    
    steps:
      - name: Download all installers
        uses: actions/download-artifact@v4
        with:
          path: installers

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "LOST ${{ github.ref_name }}"
          body: |
            ## Що нового у ${{ github.ref_name }}

            Опис змін цього релізу.

            ## Завантаження

            | Операційна система | Файл |
            |---|---|
            | Windows 10/11 | `*.msi` |
            | macOS 12+ | `*.dmg` |
            | Ubuntu/Debian | `*.deb` |
          files: |
            installers/**/*
          draft: false
          prerelease: false
